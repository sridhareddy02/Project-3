name: Weekly data-quality report

# Demonstrates scheduling and publishing. Replace the generate steps with a download of real exports into
# data/raw, then run the same `run` command to gate and publish.
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate demo exports (with defects)
        run: PYTHONPATH=src python -m mktg_pipeline generate --out data/raw --defects
      - name: Run the pipeline (report only, do not fail the job)
        run: PYTHONPATH=src python -m mktg_pipeline run --raw data/raw --out reports/latest --legacy-dashboard
      - name: Publish the summary on the run page
        if: always()
        run: cat reports/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: reports/latest
